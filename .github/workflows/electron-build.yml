name: Electron Build

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/electron-build.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/electron-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-name: yap-electron-macos
          - platform: windows-latest
            artifact-name: yap-electron-windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/native-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/native-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Check renderer
        working-directory: desktop
        run: pnpm run check

      - name: Check Electron main/preload
        working-directory: desktop
        run: pnpm run electron:check

      - name: Clean previous Electron outputs
        working-directory: desktop
        shell: bash
        run: rm -rf release-electron dist-electron

      - name: Package Electron app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: pnpm run electron:package:ci

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/release-electron/*.dmg
            desktop/release-electron/*.zip
            desktop/release-electron/*.exe
            desktop/release-electron/*.blockmap
            desktop/release-electron/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: yap-electron-macos
          path: artifacts/electron

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: yap-electron-windows
          path: artifacts/electron

      - name: Publish Electron release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/electron/**/*.dmg
            artifacts/electron/**/*.zip
            artifacts/electron/**/*.exe
            artifacts/electron/**/*.blockmap
            artifacts/electron/**/latest*.yml
